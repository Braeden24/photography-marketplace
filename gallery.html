<!DOCTYPE html>
<html>
<head>
   	<meta charset="utf-8" />
   	<meta name="viewport" content="width=device-width,initial-scale=1.0">
   	<title>Photography</title>
   	<link rel="stylesheet" href="gallery.css" />
	<script src="js/photos.js"></script>
	<script src="js/gallery.js"></script>
</head>

<main class="gallery">
    <aside class="filter-sidebar">
        <h2>Filters</h2>

        <label for="category-filter">Category</label>
        <select id="category-filter">
            <option value="all">All Photos</option>
            <option value="animals">Animals</option>
            <option value="landscapes">Landscapes</option>
            <option value="plants">Plants</option>
        </select>

        <label for="photographer-filter">Photographer</label>
        <select id="photographer-filter">
            <option value="all">All Photographers</option>
            <option value="Mike Klein">Mike Klein</option>
            <option value="Sue Carlson">Sue Carlson</option>
            <option value="Wendy Carlson">Wendy Carlson</option>
        </select>

        <button id="clear-filters" type="button">
            Clear Filters
        </button>
    </aside>

    <section class="gallery-section">
        <h1>Explore Photography</h1>

        <input type="search" id="photo-search" placeholder="Search photographs...">

        <p id="results-count"></p>

        <div id="photo-gallery" class="photo-gallery"></div>

        <p id="empty-message" hidden>
            No photographs match your filters.
        </p>
    </section>
</main>
</html>
