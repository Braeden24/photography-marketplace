<!DOCTYPE html>
<html>
<head>
   	<meta charset="utf-8" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
   	<meta name="viewport" content="width=device-width,initial-scale=1.0">
   	<title>Photography</title>
   	<link rel="stylesheet" href="css/gallery.css" />
	<script src="js/photos.js" defer></script>
	<script src="js/gallery.js" defer></script>
</head>

<main class="marketplace" id="marketplace">    
	<aside class="filter-sidebar" id="filter-sidebar">        
		<h2>Filters</h2>
       	<div class="filter-group">
    		<p class="filter-heading">Category</p>

    		<label>
        		<input type="radio" name="category" value="all" checked>
        		All Photos
   	 		</label>

    		<label>
        		<input type="radio" name="category" value="animals">
        		Animals
   		 	</label>

    		<label>
        		<input type="radio" name="category" value="landscapes">
        		Landscapes
    		</label>

    		<label>
        		<input type="radio" name="category" value="plants">
        		Plants
    		</label>
		</div>

		<div class="filter-group">
    		<p class="filter-heading">Photographer</p>

    		<label>
        		<input type="radio" name="photographer" value="all" checked>
        		All Photographers
    		</label>

    		<label>
        		<input type="radio" name="photographer" value="Mike Klein">
        		Mike Klein
    		</label>

    		<label>
        		<input type="radio" name="photographer" value="Sue Carlson">
        		Sue Carlson
    		</label>

    		<label>
        		<input type="radio" name="photographer" value="Wendy Carlson">
        		Wendy Carlson
    		</label>
		</div>

		<button id="clear-filters" type="button">
    		Clear Filters
		</button>

		<button class="filter-toggle" id="filter-toggle" type="button" aria-label="Hide filters" aria-controls="filter-sidebar" aria-expanded="true">
			<span class="filter-icon">☷</span>
		</button>
    </aside>

    <section class="gallery-section">
        <h1>Explore Photography</h1>

        <input type="search" id="photo-search" placeholder="Search photographs...">

        <p id="results-count"></p>

        <div id="photo-gallery" class="photo-gallery"></div>

        <p id="empty-message" hidden>
            No photographs match your filters.
        </p>
    </section>
	
	<aside class="cart-section">
	</aside>
	
</main>
</html>
