		<!-- Paragraph containing order details -->
		<fieldset  class = "item details">
			<legend><strong>Order Details</strong></legend>
		</fieldset>
		<!-- Fieldset for creditcard infomation -->
		<section class="item creditcard">
			<fieldset id="creditcard">
			<legend><strong>Credit Information</strong></legend>
			
			<!-- Radio inputs for each supported credit card -->
			<label for="cardName">Name*
				<input name="cardName" id="cardName" required type="text" />              
			</label>
			<label>Credit Card*
				<fieldset id="cards">
				<label class="cardLabel">
					<input name="credit" value="amex" type="radio" required />               
					<span>American Express</span>
				</label>
				<label class="cardLabel">               
					<input name="credit" value="discover" type="radio" />
					<span>Discover</span>
				</label>
				<label class="cardLabel">                              
					<input name="credit" value="master" type="radio"  />
					<span>MasterCard</span>
				</label>
				<label class="cardLabel">                                    
					<input name="credit" value="visa" type="radio"  />
					<span>Visa</span>
				</label>
				</fieldset>
			</label> 
			
			
			<!-- sets pattern for creditcard infomation -->
			<label for="cardNumber">Credit Card Number*
				<input name="cardNumber" id="cardNumber" required type="text"/>
			</label>
			<!-- Selection options for experation date and year -->
			<label for="expMonth">Expiration Date*
			<select id="expMonth" name="expMonth">
				<option value="mm">mm</option>
				<option value="01">01</option>
				<option value="02">02</option>
				<option value="03">03</option>
				<option value="04">04</option>
				<option value="05">05</option>
				<option value="06">06</option>
				<option value="07">07</option>
				<option value="08">08</option>
				<option value="09">09</option>
				<option value="10">10</option>
				<option value="11">11</option>
				<option value="12">12</option>
			</select>
			
			<span id="separator"> / </span>
			<select id="expYear" name="expYear">
				<option value="yy">yy</option>
				<option value="2022">2022</option>
				<option value="2023">2023</option>
				<option value="2024">2024</option>
				<option value="2025">2025</option>
				<option value="2026">2026</option>
			</select> 
			</label>
			<!-- Input field for card cvc -->
			<label for="cvc">CVC*
				<input name="cvc" id="cvc" required pattern="^\d{3,4}$" type="text"/>
			</label>
			</fieldset>
		</section>

			</label>
			<!-- Input field for users country -->
			<label for="countryShip">Country <span>*</span>

			</label>
			<!-- Input field for users postal code -->
			<label for="codeShip">Postal Code <span>*</span>
				<input type="text" required id="codeShip" name="codeShip" /> 
			</label>	
			</fieldset>
		</section>
